
bundle:
  name: supermarket_databricks_medallion

variables:
  catalogo:
    default: dbw_supermarket_dev

targets:
  prod:
    workspace:
      host: https://adb-7405605165112572.12.azuredatabricks.net
    variables:
      catalogo: dbw_supermarket_prod

resources:
  jobs:
    etl_supermarket:
      name: ETL Supermarket Medallion PROD
      max_concurrent_runs: 1

      tasks:
        - task_key: preparar_ambiente
          environment_key: serverless
          notebook_task:
            notebook_path: ./proceso/00_preparar_ambiente.py
            base_parameters:
              catalogo: ${var.catalogo}

        - task_key: ingest_bronze
          depends_on:
            - task_key: preparar_ambiente
          environment_key: serverless
          notebook_task:
            notebook_path: ./proceso/01_ingest_bronze.py
            base_parameters:
              catalogo: ${var.catalogo}

        - task_key: transform_silver
          depends_on:
            - task_key: ingest_bronze
          environment_key: serverless
          notebook_task:
            notebook_path: ./proceso/02_transform_silver.py
            base_parameters:
              catalogo: ${var.catalogo}

        - task_key: load_gold
          depends_on:
            - task_key: transform_silver
          environment_key: serverless
          notebook_task:
            notebook_path: ./proceso/03_load_gold.py
            base_parameters:
              catalogo: ${var.catalogo}

        - task_key: aplicar_grants
          depends_on:
            - task_key: load_gold
          environment_key: serverless
          notebook_task:
            notebook_path: ./proceso/04_aplicar_grants.py
            base_parameters:
              catalogo: ${var.catalogo}
              grupo: supermarket_lectores

      environments:
        - environment_key: serverless
          spec:
            environment_version: "2"
